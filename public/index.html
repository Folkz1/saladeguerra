<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sala de Guerra</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <div class="top-row">
      <h1 id="title">Sala de Guerra</h1>
      <a class="home-link" href="/">Início</a>
    </div>
    <div class="meta">
      <span id="target"></span>
      <span id="revenue"></span>
      <span id="updated"></span>
    </div>
    <nav id="pages" class="pages"></nav>
  </header>

  <main>
    <section class="toolbar">
      <input id="q" type="search" placeholder="Buscar por título, contexto, tag..." />
      <select id="ownerFilter">
        <option value="">Todos os owners</option>
      </select>
      <select id="priorityFilter">
        <option value="">Todas prioridades</option>
        <option value="p0">P0</option>
        <option value="p1">P1</option>
        <option value="p2">P2</option>
        <option value="p3">P3</option>
      </select>
    </section>

    <section class="views" id="views">
      <button data-view="kanban" class="active">Kanban</button>
      <button data-view="today">Hoje</button>
      <button data-view="overdue">Atrasados</button>
    </section>

    <section id="kpis" class="kpis"></section>
    <section id="board" class="board"></section>
  </main>

  <footer>
    <small>Kanban Profissional • Atualização via API • Subpáginas: /p/&lt;slug&gt;</small>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
